<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Background -->
  <rect x="0" y="0" width="500" height="500" fill="#1a1a2e"/>
  
  <!-- Pizza slice triangle -->
  <path d="M 250,50 L 450,400 L 50,400 Z" fill="#FFD700"/>
  
  <!-- Crust at bottom -->
  <path d="M 450,400 L 50,400 L 70,430 L 430,430 Z" fill="#FF6B35"/>
  
  <!-- Pepperoni 1 - Top center -->
  <circle cx="250" cy="150" r="42" fill="#C62828"/>
  <circle cx="243" cy="143" r="14" fill="#E74C3C" opacity="0.6"/>
  
  <!-- Pepperoni 2 - Middle left -->
  <circle cx="175" cy="250" r="40" fill="#C62828"/>
  <circle cx="168" cy="243" r="13" fill="#E74C3C" opacity="0.6"/>
  
  <!-- Pepperoni 3 - Middle right -->
  <circle cx="325" cy="250" r="40" fill="#C62828"/>
  <circle cx="318" cy="243" r="13" fill="#E74C3C" opacity="0.6"/>
  
  <!-- Pepperoni 4 - Bottom left corner -->
  <circle cx="150" cy="340" r="37" fill="#C62828"/>
  <circle cx="143" cy="333" r="12" fill="#E74C3C" opacity="0.6"/>
  
  <!-- Pepperoni 5 - Bottom right corner -->
  <circle cx="350" cy="340" r="37" fill="#C62828"/>
  <circle cx="343" cy="333" r="12" fill="#E74C3C" opacity="0.6"/>
  
  <!-- Pepperoni 6 - Bottom center -->
  <circle cx="250" cy="320" r="40" fill="#C62828"/>
  <circle cx="243" cy="313" r="13" fill="#E74C3C" opacity="0.6"/>
</svg>